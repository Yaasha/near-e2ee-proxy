services:
  proxy:
    image: near-e2ee-proxy:local
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      NEAR_AI_API_KEY: ${NEAR_AI_API_KEY:?Supply NEAR_AI_API_KEY in the process environment}
      PROXY_API_KEY: ${PROXY_API_KEY:?Supply a separate PROXY_API_KEY in the process environment}
      LISTEN_ADDR: 0.0.0.0:8080
      MODELS: ${MODELS:-Qwen/Qwen3.8-27B}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    # More than the application's ten-second drain deadline.
    stop_grace_period: 15s
