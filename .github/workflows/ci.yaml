name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      recover_digest:
        description: 'Optional: repair aliases of an existing version using its exact preserved digest; select its v tag'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt an in-flight registry write. PR validation remains cancellable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.15
          install: false
          cache: false
      - run: mise --locked install
      - run: mise run lint
      - run: mise run check

  containers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.15
          install: false
          cache: false
      - run: mise --locked install
      - run: mise run container-test
        env:
          CONTAINER_ARCH: ${{ matrix.arch }}

  publish:
    needs: [check, containers]
    if: >-
      github.repository == 'Yaasha/near-e2ee-proxy' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.check.result == 'success' && needs.containers.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Every development/release check and write is inside this same lock.
    # Never use separate per-event/per-tag locks or cancel an active writer.
    concurrency:
      group: ghcr-publication
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.result.outputs.digest }}
    env:
      VALIDATION_RESULTS: ${{ toJSON(needs) }}
      RECOVER_DIGEST: ${{ inputs.recover_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.15
          install: false
          cache: false
      - run: mise --locked install
      - name: Check trusted source, validation and version preservation
        id: plan
        run: mise exec -- go run ./internal/distribution prepare >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
          buildkitd-flags: ''
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Creation timestamp
        id: metadata
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build the validated immutable source and publish its candidate or source tag
        id: build
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: https://github.com/Yaasha/near-e2ee-proxy.git#${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/yaasha/near-e2ee-proxy:${{ steps.plan.outputs.build_tag }}
          provenance: mode=max,version=v1
          sbom: true
          labels: |
            org.opencontainers.image.title=NEAR E2EE Proxy
            org.opencontainers.image.description=Verified model-key E2EE Chat Completions proxy
            org.opencontainers.image.source=https://github.com/Yaasha/near-e2ee-proxy
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
      - name: Inspect registry attachments and publish guarded tags or recover aliases
        id: result
        run: |
          if [ -n "$RECOVER_DIGEST" ]; then
            digest="$RECOVER_DIGEST"
            mise exec -- go run ./internal/distribution recover "$digest" >> "$GITHUB_STEP_SUMMARY"
          else
            digest="$IMAGE_DIGEST"
            mise exec -- go run ./internal/distribution promote "$digest" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo 'Pin the exact digest for deployment. Publication does not deploy the service.' >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}

  public-pull:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    # This job has no registry login and cannot write packages. A first private
    # publication fails here until its owner explicitly makes the package public.
    env:
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Anonymous digest pull and isolated CLI smoke check
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          mkdir -p "$DOCKER_CONFIG"
          image="ghcr.io/yaasha/near-e2ee-proxy@$IMAGE_DIGEST"
          docker pull --platform "linux/$ARCH" "$image"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true --platform "linux/$ARCH" "$image" -help
          echo "Anonymous linux/$ARCH pull and isolated CLI check passed for $image" >> "$GITHUB_STEP_SUMMARY"
