# mise installs this exact compiler version without changing system packages.
[tools]
go = "1.27.3"
actionlint = "1.7.12"
hadolint = "2.15.1"

[env]
# Let mise select Go; prevent Go from downloading a different compiler itself.
GOTOOLCHAIN = "local"

[tasks.dev]
description = "Run the proxy with mise loading development configuration from .env"
env._.file = { path = ".env", redact = true }
run = "go run ./cmd/near-e2ee-proxy"

[tasks.build]
description = "Build the proxy into bin/"
depends = ["toolchain"]
run = "go build -o bin/ ./cmd/..."

[tasks.toolchain]
description = "Reject compiler drift from the mise and module pins"
run = "sh tools/check-go.sh"

[tasks.lint]
description = "Lint workflows and Dockerfile with pinned tools (no source rewriting)"
run = "actionlint -shellcheck= && hadolint Dockerfile"

[tasks.container-test]
description = "Build and test a hardened container; requires Docker (CONTAINER_ARCH=amd64 or arm64)"
depends = ["toolchain"]
run = "go test -tags=container ./internal/container -count=1 -timeout=20m -v"

[tasks.distribution-test]
description = "Offline publication eligibility, stale-run and registry artifact regressions"
depends = ["toolchain"]
run = "go test ./internal/distribution -count=1"

[tasks.fmt]
description = "Format Go source files in place"
run = "gofmt -w cmd internal"

[tasks.format-check]
description = "Check Go formatting without changing files"
run = '''
unformatted="$(gofmt -l cmd internal)"
if [ -n "$unformatted" ]; then
  printf 'Run mise run fmt to format these files:\n%s\n' "$unformatted" >&2
  exit 1
fi
'''

[tasks.vet]
description = "Check Go code for common mistakes"
depends = ["toolchain"]
run = "go vet ./..."

[tasks.test]
description = "Run offline Go tests with the race detector"
depends = ["toolchain"]
run = "go test -race ./..."

[tasks.smoke]
description = "Check the built command and run the HTTP smoke test"
depends = ["build"]
run = '''
./bin/near-e2ee-proxy -help
go test ./internal/proxy -run '^TestHTTPServerSmoke$' -count=1
'''

[tasks.live]
description = "Run four bounded paid Chat HTTP checks using the development key"
env = { NEAR_LIVE_TEST = "1", _.file = { path = ".env", redact = true } }
run = "go test -tags=live ./internal/proxy -run '^TestLiveChatProxy$' -count=1 -v"

[tasks.check]
description = "Run formatting, vet, tests, build and executable smoke checks"
depends = ["format-check", "vet", "test", "smoke"]

[tasks.benchmark]
description = "Compare the real proxy and NEAR API: ten synthetic requests, at most 256 output tokens each"
env = { NEAR_BENCHMARK = "1", NEAR_BENCHMARK_OUTPUT = "{{config_root}}/.cache/benchmarks/latest.json", _.file = { path = ".env", redact = true } }
run = "go test -tags=benchmark ./internal/near -run '^TestProxyBenchmark$' -count=1 -timeout=7m -v"
